# Local verification stack for the catalog crawler.
#
# Brings up the crawler's Postgres, the onix adapter built with plugins and
# configured for the crawl module, and a static file server standing in for a
# publisher origin (it serves install/crawler-fixture/publisher, which holds a
# catalog index plus its baseline and change file with real sha-256 digests,
# a real Ed25519 self-signature on the index entry, and a real Ed25519
# self-signature embedded in each catalog file's own content). Index and
# signatures are regenerated by one command:
#   go run ./install/crawler-fixture/gen
#
# THIS STACK IS NOT SELF-CONTAINED. It cannot be, and pretending otherwise
# would waste your afternoon. Two things it does not provide:
#
# 1. A working REGISTRY record. The crawler verifies every catalog INDEX ENTRY
#    and every catalog FILE against the publishing node's signing key AS HELD
#    IN THE NETWORK REGISTRY. There is no trusted-key environment variable any
#    more and no way to turn verification off. The adapter will not even start
#    without a registry plugin block (it is in
#    crawler-fixture/adapter-crawler.yaml, using the starter-kit's own
#    `dediregistry` against the real DeDi wrapper API, not a local stand-in).
#    Until crawler-fixture/registry-subscription.json's fixture key is actually
#    registered THERE, every catalog file fails key resolution: the sync
#    retries with backoff and then parks. Everything up to key resolution
#    still runs and is worth watching.
#
# 2. The DISCOVERY SERVICE. Discovery is expected on the HOST (not in this
#    compose file), reached via host.docker.internal (see CRAWLER_PUSH_ENDPOINT
#    below). If Discovery instead runs as its own compose stack on
#    'beckn-network', point CRAWLER_PUSH_ENDPOINT at its container hostname
#    instead and drop the beckn-network dependency's host.docker.internal note.
#
# Read install/crawler-fixture/README.md for what to stand up and in what order.
#
#   docker network create beckn-network     # one time, if it does not exist
#   docker compose -f install/docker-compose-crawler2.yml up --build
#
# Note on the fixture network's subnet: the crawler's fetch layer refuses any
# publisher URL that resolves to a loopback/private/link-local/CGNAT address
# (the SSRF guard in internal/crawler/fetch/guard.go), and it has no env switch
# to disable that -- AllowPrivateFetch is a test-only Option. A normal Docker
# bridge hands out 172.16/12 addresses, which the guard rejects, so the fixture
# network is pinned to 203.0.113.0/24 (RFC 5737 TEST-NET-3: reserved for
# documentation, never routed on the internet, and not in any range the guard
# treats as private). That is what lets a real crawl of publisher-origin
# succeed without weakening the guard.

name: beckn-onix-crawler2-verify

services:
  # ============================================
  # The crawler's own Postgres (crawler_index / crawler_queue / crawler_catalog).
  # Migrations are embedded in the crawler and applied on every startup.
  # ============================================
  crawler-postgres:
    image: postgres:16-alpine
    container_name: crawler2-postgres
    environment:
      POSTGRES_DB: ${CRAWLER_DB_NAME:-crawler}
      POSTGRES_USER: ${CRAWLER_DB_USER:-crawler}
      POSTGRES_PASSWORD: ${CRAWLER_DB_PASSWORD:-crawler}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      # Host port only so you can psql into it; nothing in the stack uses it.
      - "${CRAWLER_DB_HOST_PORT:-5439}:5432"
    volumes:
      - crawler_postgres_data:/var/lib/postgresql/data
    networks:
      - crawler-fixture
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CRAWLER_DB_USER:-crawler} -d ${CRAWLER_DB_NAME:-crawler}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # ============================================
  # Publisher origin: a static file server hosting the sample catalog index and
  # its catalog files. Stands in for a real publisher's CDN.
  #   http://publisher-origin/catalog-index.json
  #   http://publisher-origin/catalogs/cat-ev-001-v1.json
  #   http://publisher-origin/catalogs/cat-ev-001-v1-to-v2.json
  # nginx serves ETag + Last-Modified, so the crawler's conditional-GET path
  # (304 Not Modified on an unchanged index) is exercised too.
  # ============================================
  publisher-origin:
    image: nginx:alpine
    container_name: crawler2-publisher-origin
    volumes:
      - ./crawler-fixture/publisher:/usr/share/nginx/html:ro
    ports:
      # Host port for eyeballing the fixture: curl localhost:8089/catalog-index.json
      - "${PUBLISHER_HOST_PORT:-8089}:80"
    networks:
      crawler-fixture:
        # Static address in the documentation range so the SSRF guard accepts it
        # (see docker-compose-crawler.yml's note on the fixture subnet).
        ipv4_address: 203.0.113.10
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost/catalog-index.json"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ============================================
  # The onix adapter, built from this repo WITH plugins (the crawler ships as a
  # .so), running the crawl-only config in install/crawler-fixture.
  # ============================================
  onix-crawler:
    build:
      context: ..
      dockerfile: Dockerfile.adapter-with-plugins
    image: beckn/onix-adapter-crawler:test
    container_name: onix-crawler2
    depends_on:
      crawler-postgres:
        condition: service_healthy
      publisher-origin:
        condition: service_healthy
    ports:
      - "${ONIX_HOST_PORT:-8091}:8091"
    environment:
      CONFIG_FILE: /app/config/adapter-crawler.yaml

      # --- crawler: on/off and persistence -------------------------------
      # CRAWLER_ENABLED defaults to false in the crawler's own config loader
      # (it is opt-in), so this fixture has to switch it on explicitly.
      CRAWLER_ENABLED: "true"
      CRAWLER_STORE_PROVIDER: "${CRAWLER_STORE_PROVIDER:-postgres}"
      CRAWLER_DB_DSN: "${CRAWLER_DB_DSN:-postgres://crawler:crawler@crawler2-postgres:5432/crawler?sslmode=disable}"

      # --- crawler: the publisher trust anchor ----------------------------
      # There is nothing to set here, and that is the point.
      #
      # The signature gate fails CLOSED, and its keys come from the NETWORK
      # REGISTRY, not from configuration. The crawler looks a key up by
      # {index nodeId, signature keyId} exactly the way signvalidator resolves
      # transport-signature keys -- once for each catalog INDEX ENTRY's own
      # self-signature, and again for each fetched catalog FILE's own embedded
      # self-signature.
      #
      # The registry is configured as a PLUGIN, in
      # crawler-fixture/adapter-crawler.yaml -- the starter-kit's `dediregistry`
      # against the real DeDi wrapper API (config/local-beckn-one-bap.yaml's own
      # crawl module uses the same plugin), not a local stand-in. It is
      # required: the crawl handler refuses to construct without it. The record
      # the fixture publisher's key has to exist as, in THAT registry, is
      # crawler-fixture/registry-subscription.json:
      #   subscriber_id      sunrise-ev.example.org
      #   key_id             fixture-key-1
      #   signing_public_key V6FwanXNHoN2lNmzQVCbpjr4r3fDyopwSoINlSNOqMw=
      # Registering it is manual and this stack does not do it -- until it is,
      # every catalog file fails key resolution (retries, then parks).
      #
      # Do NOT set CRAWLER_REGISTRY_URL. That variable is a registry as a source
      # of INDEXES to crawl, which is a different feature, is not implemented,
      # and is rejected at startup. Sources come from CRAWLER_INDEX_URLS below.

      # --- crawler: where catalogs go ------------------------------------
      # Discovery is NOT part of this stack. This is its /catalog/push on the
      # shared external beckn-network; beckn-discovr must already be up.
      # host.docker.internal, not localhost: Discovery is reached from inside
      # this container, and "localhost" there means the container itself.
      # Docker Desktop (Mac/Windows) resolves host.docker.internal to the host
      # automatically; on native Linux Docker you'd need
      # --add-host=host.docker.internal:host-gateway instead.
      CRAWLER_PUSH_ENDPOINT: "${CRAWLER_PUSH_ENDPOINT:-http://host.docker.internal:8085/beckn/catalog/push}"

      # --- crawler: where catalogs come from -----------------------------
      # Config-driven (config/settings.go's splitCSV supports a comma-separated
      # list, but there's just the one source for now). Polled on the scheduled
      # index job's own cadence (CRAWLER_INDEX_INTERVAL below) -- no /crawl call
      # needed, since this is config-driven, not registry-driven.
      CRAWLER_INDEX_URLS: "${CRAWLER_INDEX_URLS:-https://angular-absently-gab.ngrok-free.dev/beckn/index/becknCatalogs.index.json}"
      # becknCatalogs.index.json's catalog declares networkIds
      # ["beckn.one/testnet", "nfh.global/testnet"] -- not public, so it is only
      # taken (enqueued) if it intersects what this crawler is configured for.
      CRAWLER_NETWORK_IDS: "${CRAWLER_NETWORK_IDS:-beckn.one/testnet}"
      # Identity this crawler puts on the /push context as bppUri.
      CRAWLER_BPP_URI: "${CRAWLER_BPP_URI:-http://onix-crawler:8091}"

      # --- crawler: cadence + caps ---------------------------------------
      # Tighter than production defaults (5m / 30s) so a local run finishes
      # while you are watching the logs.
      CRAWLER_INDEX_INTERVAL: "${CRAWLER_INDEX_INTERVAL:-30s}"
      CRAWLER_CATALOG_INTERVAL: "${CRAWLER_CATALOG_INTERVAL:-5s}"
      CRAWLER_FETCH_TIMEOUT: "${CRAWLER_FETCH_TIMEOUT:-15s}"
      CRAWLER_MAX_ARTIFACT_BYTES: "${CRAWLER_MAX_ARTIFACT_BYTES:-10485760}"
      CRAWLER_MAX_DECOMPRESSED_BYTES: "${CRAWLER_MAX_DECOMPRESSED_BYTES:-104857600}"
      CRAWLER_MAX_PUSH_BYTES: "${CRAWLER_MAX_PUSH_BYTES:-10485760}"
      CRAWLER_MAX_ATTEMPTS: "${CRAWLER_MAX_ATTEMPTS:-5}"
      CRAWLER_MERGE_ONLY: "${CRAWLER_MERGE_ONLY:-true}"
      CRAWLER_LOG_LEVEL: "${CRAWLER_LOG_LEVEL:-debug}"
    volumes:
      - ./crawler-fixture/adapter-crawler.yaml:/app/config/adapter-crawler.yaml:ro
    networks:
      # Both: the fixture network to reach publisher-origin and its Postgres,
      # and beckn-network to reach Discovery.
      - crawler-fixture
      - beckn-network

networks:
  crawler-fixture:
    name: beckn-onix-crawler2-fixture
    driver: bridge
    ipam:
      config:
        # RFC 5737 TEST-NET-3 -- see the SSRF note at the top of this file.
        - subnet: 203.0.113.0/24
          gateway: 203.0.113.1
  # Created by: docker network create beckn-network
  # Shared with beckn-discovr (and beckn-catalg), which run Discovery.
  beckn-network:
    external: true

volumes:
  crawler_postgres_data:
    name: beckn-onix-crawler2-postgres-data
