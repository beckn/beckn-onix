appName: "onix-local"
log:
  level: debug
  destinations:
    - type: stdout
  contextKeys:
    - transaction_id
    - message_id
    - subscriber_id
    - module_id
http:
  port: 8081
  timeout:
    read: 30
    write: 30
    idle: 30
pluginManager:
  root: ./plugins

# OpenTelemetry (OTLP) - metrics and traces sent to OTEL collector
plugins:
  otelsetup:
    id: otelsetup
    config:
      serviceName: "beckn-one-bap"
      serviceVersion: "1.0.0"
      environment: "development"
      domain: "ev_charging"
      otlpEndpoint: "otel-collector-bap:4317"
      enableMetrics: "true"
      networkMetricsGranularity: "2min"
      networkMetricsFrequency: "4min"
      enableTracing: "true"
      enableLogs: "true"
      timeInterval: "5"
      auditFieldsConfig: "/app/config/audit-fields.yaml" # this can be git url
      cacheTTL: "3600"

modules:
  - name: bapTxnReceiver
    path: /bap/receiver/
    handler:
      type: std
      role: bap
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            timeout: 10
            retry_max: 3
            retry_wait_min: 100ms
            retry_wait_max: 500ms
        keyManager:
          id: simplekeymanager
          config:
            subscriberId: bap.example.com
            keyId: 76EU7LZ7gfqj13dWDKR1Uitnim11mCoxWBPdzLxUpAMBPVdANKgyFM
            signingPrivateKey: TTQMAEy0xJcoRXRNofZAwZq1c3VH6j98UUaHP7budQQ=
            signingPublicKey: g/3swjI93IhZ0SScrVZapeLjU+W0AeiSid3LViYZJFo=
            encrPrivateKey: TTQMAEy0xJcoRXRNofZAwZq1c3VH6j98UUaHP7budQQ=
            encrPublicKey: g/3swjI93IhZ0SScrVZapeLjU+W0AeiSid3LViYZJFo=
        cache:
          id: cache
          config:
            addr: localhost:6379
        payloadStore:
          id: payloadstore
          config:
            ttl: "24h"
            indexTTL: "25h"
            maxBodyBytes: "1048576"
            storeBody: "true"
            storeSignature: "true"
            compress: "true"
        schemaValidator:
          id: schemav2validator
          config:
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "beckn.org,example.com,raw.githubusercontent.com"
        signValidator:
          id: signvalidator
        signer:
          id: signer
        router:
          id: router
          config:
            routingConfig: ./config/local-beckn-one-routing-BAPReceiver.yaml
        checkPolicy:
          id: opapolicychecker
          config:
            networkPolicyConfig: ./config/opa-network-policies.yaml
            refreshInterval: "5m"
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transaction_id,message_id
              role: bap
      steps:
        - validateSign
        - checkPolicy
        - validateSchema
        - addRoute
        - storePayload
        - signAck
  
  - name: bapTxnCaller
    path: /bap/caller/
    handler:
      type: std
      role: bap
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            timeout: 10
            retry_max: 3
            retry_wait_min: 100ms
            retry_wait_max: 500ms
        keyManager:
          id: simplekeymanager
          config:
            subscriberId: bap.example.com
            keyId: 76EU7LZ7gfqj13dWDKR1Uitnim11mCoxWBPdzLxUpAMBPVdANKgyFM
            signingPrivateKey: TTQMAEy0xJcoRXRNofZAwZq1c3VH6j98UUaHP7budQQ=
            signingPublicKey: g/3swjI93IhZ0SScrVZapeLjU+W0AeiSid3LViYZJFo=
            encrPrivateKey: TTQMAEy0xJcoRXRNofZAwZq1c3VH6j98UUaHP7budQQ=
            encrPublicKey: g/3swjI93IhZ0SScrVZapeLjU+W0AeiSid3LViYZJFo=
        cache:
          id: cache
          config:
            addr: localhost:6379
        payloadStore:
          id: payloadstore
          config:
            ttl: "24h"
            indexTTL: "25h"
            maxBodyBytes: "1048576"
            storeBody: "true"
            storeSignature: "true"
            compress: "true"
        schemaValidator:
          id: schemav2validator
          config:
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "beckn.org,example.com,raw.githubusercontent.com"
        router:
          id: router
          config:
            routingConfig: ./config/local-beckn-one-routing-BAPCaller.yaml
        signer:
          id: signer
        signValidator:
          id: signvalidator
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transaction_id,message_id
              role: bap
        checkPolicy:
          id: opapolicychecker
          config:
            networkPolicyConfig: ./config/opa-network-policies.yaml
            refreshInterval: "5m"
      steps:
        - checkPolicy
        - addRoute
        - sign
        - validateSchema
        - storePayload
        - validateAckSign

  # /crawl: DS-internal, unsigned on-demand trigger to re-crawl one provider's
  # index now. The crawler's scheduled index + catalog jobs run in the
  # background from plugin init: they resolve each catalog (baseline + change
  # files), schema-validate the push body, and push to Discovery with
  # publishDirectives updateMode=MERGE + visibleTo. Secrets + deploy-specific
  # values come from env (CRAWLER_DB_DSN, CRAWLER_PUSH_ENDPOINT); non-secret
  # config lives here. Env overrides these keys when it is set to a non-empty
  # value.
  #
  # The crawler is opt-in: it stays inert unless CRAWLER_ENABLED=true, so this
  # module can be registered without requiring a Postgres. It is left off here.
  # To see it actually crawl, use the stack in
  # install/docker-compose-crawler.yml (Postgres + a sample publisher origin)
  # and read install/crawler-fixture/README.md first: a crawl also needs a
  # registry that holds the publisher's signing key.
  - name: crawl
    path: /crawl
    handler:
      type: crawl
      role: bap
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        # REQUIRED for the crawl handler. This is the crawler's trust anchor:
        # every catalog file it ingests carries a signature over
        # {catalogId, version, url, digest, validUntil}, and the verifying key
        # is looked up here by {subscriberId, keyId} -- the index's
        # participantId and the file entry's keyId. That is the same channel
        # signvalidator uses for transport signatures. There is no key list in
        # env or YAML. Without this block NewCrawlHandler refuses to construct,
        # because a crawler that cannot resolve keys verifies nothing and would
        # park every catalog it ever saw.
        #
        # NOTE: dediregistry requires `url` (the DeDi wrapper API base URL,
        # including the /dedi path) and fails to initialise without it. The
        # other two modules in this file omit it; that is a gap in them, not a
        # default.
        registry:
          id: dediregistry
          config:
            url: "https://fabric.nfh.global/registry/dedi"
            timeout: 10
            retry_max: 3
            retry_wait_min: 100ms
            retry_wait_max: 500ms
        # Optional. The registry client memoises lookups in this cache, so
        # resolving one publisher key does not cost one registry call per
        # catalog file. Drop it and lookups still work, just chattier.
        cache:
          id: cache
          config:
            addr: localhost:6379
        # Optional. Validates the catalog push body before it is sent, against
        # the action in CRAWLER_SCHEMA_ACTION (default catalog/publish).
        schemaValidator:
          id: schemav2validator
          config:
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
        crawler:
          id: crawler
          config:
            # Off by default. Set CRAWLER_ENABLED=true (here or in env) to make
            # the plugin open a database and start the jobs. Doing so makes
            # CRAWLER_DB_DSN, CRAWLER_PUSH_ENDPOINT and CRAWLER_INDEX_URLS
            # required.
            CRAWLER_ENABLED: "false"
            # DB DSN + push endpoint come from env (secrets / deploy-specific):
            #   CRAWLER_DB_DSN=postgres://user:pass@host:5432/db?sslmode=disable
            #   CRAWLER_PUSH_ENDPOINT=https://discovery.local/beckn/catalog/push
            #
            # CRAWLER_INDEX_URLS is the only source of indexes to crawl, and it
            # is also the allowlist /crawl checks an incoming indexUrl against.
            # CRAWLER_REGISTRY_URL (a registry as an INDEX SOURCE, which is a
            # different thing from the registry plugin above) is not wired and
            # is rejected at startup, so do not set it.
            CRAWLER_INDEX_URLS: "https://cdn.publisher.example.com/beckn/catalog-index.json"
            CRAWLER_NETWORK_IDS: ""
            CRAWLER_INDEX_INTERVAL: "5m"
            CRAWLER_CATALOG_INTERVAL: "30s"
            CRAWLER_FETCH_TIMEOUT: "15s"
            CRAWLER_MAX_ARTIFACT_BYTES: "10485760"
            CRAWLER_MAX_ATTEMPTS: "5"
