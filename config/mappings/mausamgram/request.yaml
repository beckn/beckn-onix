# Mausamgram: OAN requests -> the provider's own.
#
# Keyed by the Beckn action each mapping translates.
#
# An action declared with no mapping needs no request document built: this
# provider takes its parameters in the query string, the step has already
# resolved them, and putting them through a transform to arrive at the same two
# fields would buy nothing. The values the step resolved become the parameters.
#
# It is still declared, so this file remains the statement of what the capability
# serves. An action absent from here is one it does not serve at all -- a
# different thing, and refused.
#
# An action that DOES need a document -- a provider wanting a body in its own
# shape -- carries its transform here, reading:
#   beckn    the inbound Beckn payload
#   _local   whatever the step resolved before the call
actions:
  select: ""
