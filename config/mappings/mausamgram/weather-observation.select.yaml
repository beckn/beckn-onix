# Mausamgram, openagrinet:WeatherObservation, select. Both directions, one file.
#
# One file per binding-action rather than one per direction, because both legs of
# one upstream call are one unit of configuration: they are published, reviewed
# and retired together, and a reference to one is a reference to the other.
#
# The registry entry pointing here decides which action this serves, so nothing
# in the file names it. The filename's action segment must match that entry --
# a mismatch would apply a correct mapping to the wrong call, silently.
#
# Both halves read:
#   beckn     the inbound Beckn payload -- the context to echo, the offer to
#             quote against
# and the response half additionally reads:
#   response  the provider's answer, in its own shape
#
# Nothing else is in scope. Values the provider step resolved before the call are
# not passed in: the step holds them and used them to make the call, so a mapping
# reading them back would be a second name for the same data. Where the answer
# needs them, it takes them from what the provider echoed.

# The response half follows the openagrinet:WeatherObservation v0.1 schema pack,
# Direct mode. The pack lives in OpenAgriNet/network-specs; it is referred to
# here by name and version rather than by a path, because a path pins a branch
# and a branch moves.
#
# @context is the canonical schemas.openagrinet.global identifier. In JSON-LD
# that is a name, not a fetch target -- it does not have to resolve today, and
# substituting a raw git URL that does would put an implementation detail on the
# wire and break every consumer when the branch is renamed.
#
# Direct mode requires observationType, source, location, generatedAt and
# parameters. informationMode is what selects those requirements: a catalog
# resource advertising this capability is OnDemand instead, and carries
# supportedParameters rather than values.
#
# The answer quotes ONE resource, carrying the id the request selected. The
# forecast days are content of that resource, under observations.
#
# Minting a resource per day was the earlier shape, and it broke the offer: the
# offer is echoed from the request, so its resourceIds still pointed at the id
# the consumer selected while the resources carried freshly invented ones.
# Nothing in the answer resolved that reference. Keeping the selected id is what
# makes it stay true.
#
# TWO FIELDS HERE ARE NOT IN THE PACK, and both are deliberate. The pack sets no
# additionalProperties, so they validate; they are simply not governed by it.
#
#   observations   The pack carries one validity and one flat parameters array
#                  per resource, so it cannot express a five-day forecast in the
#                  one resource the request selected. Its own examples show one
#                  resource per period. Keeping the selected id was judged worth
#                  more than splitting into five resources the consumer never
#                  asked for. Revisit if the packs gain a series field.
#   aggregation    The pack's parameter entry is parameter/value/unit only. This
#                  provider reports a minimum AND a maximum for temperature and
#                  humidity, which are indistinguishable without it.
#
# Fields that are the same for every day -- the point, the source, the
# observation type -- sit once at the top. Only what varies per day repeats.

# An empty request half means there is no request document to build. This
# provider takes its parameters in the query string and the step resolved them
# already, so it sends those directly. For a method that takes a body, an empty
# half would mean exactly what it says: no body.
request: ""

# Keyed by direction, not by the action it produces: a select is answered by an
# on_select over the same HTTP round trip, so the callback is this half rather
# than an action of its own.
response: |
  (
    $lat := response.location.lat;
    $lon := response.location.lon;
    $days := [
      response.fcstday1, response.fcstday2, response.fcstday3,
      response.fcstday4, response.fcstday5
    ];

    $reading := function($name, $aggregation, $unit, $value) {
      $exists($value) ? {
        "parameter": $name,
        "aggregation": $aggregation,
        "unit": $unit,
        "value": $value
      }
    };

    /* A warning is a parameter, not a field of its own: the pack has no
       advisory property but does have an Alert parameter. Unit "1" is what it
       prescribes for a value that has no unit. */
    $alert := function($value) {
      $exists($value) ? {
        "parameter": "Alert",
        "unit": "1",
        "value": $value
      }
    };

    $selected := beckn.message.contract.commitments[0];

    {
      "context": {
        "version": beckn.context.version,
        "action": "on_select",
        "networkId": beckn.context.networkId,
        "bapId": beckn.context.bapId,
        "bapUri": beckn.context.bapUri,
        "bppId": beckn.context.bppId,
        "bppUri": beckn.context.bppUri,
        "transactionId": beckn.context.transactionId,
        "messageId": beckn.context.messageId,
        "timestamp": $now()
      },
      "message": {
        "contract": {
          "commitments": [
            {
              "status": {
                "descriptor": { "code": "QUOTED", "name": "Quoted" }
              },
              "offer": $selected.offer,
              "resources": [
                {
                  "id": $selected.resources[0].id,
                  "resourceAttributes": {
                    "@context": "https://schemas.openagrinet.global/schema/WeatherObservation/v0.1/context.jsonld",
                    "@type": "openagrinet:WeatherObservation",
                    "informationMode": "Direct",
                    "observationType": "Forecast",
                    "subjectCategories": ["Weather"],
                    "source": {
                      "sourceId": "mausamgram",
                      "sourceName": "IMD Mausamgram NWP"
                    },
                    "location": {
                      "type": "Point",
                      "coordinates": [$lon, $lat]
                    },
                    "generatedAt": $now(),
                    "validity": {
                      "startsAt": $days[0].date,
                      "endsAt": $days[-1].date
                    },
                    "observations": $map($days, function($day) {
                      {
                        "validity": {
                          "startsAt": $day.date,
                          "endsAt": $day.date
                        },
                        "parameters": [
                          $reading("Rainfall", "Total", "mm", $day.rain),
                          $reading("Temperature", "Minimum", "Cel", $day.tmin),
                          $reading("Temperature", "Maximum", "Cel", $day.tmax),
                          $reading("Humidity", "Minimum", "%", $day.rhmin),
                          $reading("Humidity", "Maximum", "%", $day.rhmax),
                          $reading("WindSpeed", "Average", "m/s", $day.wspd),
                          $alert($day.weather_warning ? $day.weather_warning : $day.cloud_message)
                        ]
                      }
                    })
                  }
                }
              ]
            }
          ]
        }
      }
    }
  )
